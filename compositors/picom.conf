#################################
#
# Backend
#
#################################
# GLX: GPU nativo, más rápido, soporta dual_kawase blur.
# XRender: fallback software, más lento.
# Usamos GLX para máximo rendimiento con Intel GPU.
backend = "glx";
#################################
#
# GLX backend
#
#################################
# Renderizado con damage tracking — solo redibuja regiones dañadas.
# Reduce drásticamente CPU/GPU. Mantener en true.
use-damage = true;
#################################
#
# Shadows
#
#################################
shadow = true;
shadow-radius = 35;
shadow-offset-x = -35;
shadow-offset-y = -35;
shadow-opacity = 0.8;
# Exclusiones de sombra — ventanas que no deben tener sombra.
shadow-exclude = [
	# GTK CSD: apps que proveen su propia sombra
	"_GTK_FRAME_EXTENTS@:c",
	# Notificaciones y overlays
	"name = 'Notification'",
	"class_g ?= 'Notify-osd'",
	"class_g ?= 'Xfce4-notifyd'",
	"class_g ?= 'Xfce4-power-manager'",
	# Docks y panels
	"name = 'Plank'",
	"name = 'Docky'",
	"name = 'Kupfer'",
	"class_g = 'Kupfer'",
	"class_g = 'Synapse'",
	"class_g ?= 'Cairo-dock'",
	"class_g = 'Cairo-clock'",
	# Herramientas de captura/dibujo
	"name = 'Pensela'",
	"name = 'Drawing Board'",
	"class_g = 'vokoscreen' && argb",
	"name = 'Área'",
	"name *= 'Cuenta regresiva'",
	# VirtualBox
	"name = 'VirtualBox'",
	"name = 'VirtualBoxVM'",
	# Negatron
	"name = 'Negatron v0.100.1' && argb",
	# XFWM4 alt-tab
	"name ?= 'xfwm4' && argb",
	# Conky
	"class_g = 'Conky'",
	# Thunderbird / Betterbird
	"class_g = 'Thunderbird' && argb",
	"name ?= 'Betterbird' && argb",
	"class_g ?= 'Thunderbird' && class_i = 'Popup' && argb",
	"class_g = 'Thunderbird' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	"class_g = 'betterbird' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	"class_g = 'Betterbird' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	"class_g = 'Mozilla Thunderbird' && (window_type = 'utility') && argb",
	# Firefox / Tor Browser popups
	"class_g = 'firefox' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	"class_g = 'Firefox' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	"class_g = 'firefox-esr' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	"class_g = 'Firefox-esr' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	"class_g = 'Tor Browser' && (window_type = 'utility') && argb",
	"class_g = 'Navegador Tor' && (window_type = 'utility' || window_type = 'popup_menu') && argb",
	# Telegram
	"class_g = 'Telegram' && argb",
	# xdg-desktop-portal dialogs
	"class_g ~= 'xdg-desktop-portal' && _NET_FRAME_EXTENTS@:c && window_type = 'dialog'",
	"class_g ~= 'xdg-desktop-portal' && window_type = 'menu'",
	"_NET_FRAME_EXTENTS@:c && WM_WINDOW_ROLE@:s = 'Popup'",
	# KDE override
	"_NET_WM_WINDOW_TYPE:a *= '_KDE_NET_WM_WINDOW_TYPE_OVERRIDE'"
];
#################################
#
# Opacity
#
#################################
inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 1;
inactive-opacity-override = false;
#################################
#
# Blur
#
#################################
# dual_kawase: mejor blur y más rápido que gaussian/kernel.
# Requiere backend GLX.
blur-method = "dual_kawase";
# Fuerza del blur (0-20). Default 5. Subir para más desenfoque.
# blur-strength = 5;
blur-background-exclude = [
    "class_g = 'Peek'",
	"class_g = 'Pensela'",
	"name = 'Drawing Board'",
    "window_type = 'dock'",
	"window_type = 'dropdown_menu'",
	"window_type = 'combo'",
	"window_type = 'popup_menu'",
	"window_type = 'utility'",
    "window_type = 'desktop'",
  	"class_g ~= 'xdg-desktop-portal' && _NET_FRAME_EXTENTS@:c && window_type = 'dialog'",
  	"class_g ~= 'xdg-desktop-portal' && window_type = 'menu'",
  	"_NET_FRAME_EXTENTS@:c && WM_WINDOW_ROLE@:s = 'Popup'",
	"_GTK_FRAME_EXTENTS@:c",
	"bounding_shaped && !rounded_corners",
	"_NET_WM_STATE@[*]:a *= '_NET_WM_STATE_HIDDEN'",
	"_NET_WM_STATE@[0]:a = '_NET_WM_STATE@_MAXIMIZED_VERT'",
	"_NET_WM_STATE@[0]:a = '_NET_WM_STATE@_MAXIMIZED_HORZ'"
];
opacity-exclude = [
    "name = 'Stratagus'"
];
#################################
#
# Fading
#
#################################
# Fading se mantiene para compatibilidad con apps que lo usen internamente.
# Las animaciones de picom (abajo) se encargan de open/close/show/hide.
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-exclude = [ ];
#################################
#
# Animaciones (sistema script-based, picom v12+)
#
# appear:    fade-in + scale 0.95 → 1.0 al abrir/restaurar ventana
# disappear: fade-out + scale 1.0 → 0.95 al cerrar/minimizar ventana
#
# Triggers: open (nueva ventana), close (cerrar), show (restaurar), hide (minimizar)
# Duración: 0.25s — rápido pero perceptible
#
# Para más info: man picom → sección ANIMATIONS
#################################
animations = ({
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.15;
}, {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.15;
});
#################################
#
# General
#
#################################
log-level = "warn";
# Detección de foco
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
# Esquinas redondeadas
corner-radius = 4;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
# VSync — evitar tearing
vsync = true;
# Ventanas que siempre se consideran enfocadas
focus-exclude = [ "class_g = 'Cairo-clock'" ];
# Inversión de color (vacío = no aplicar)
invert-color-include = [ ];
#################################
#
# Window type settings
#
#################################
wintypes:
{
	dock = { shadow = true; };
	dnd = { shadow = false; };
	popup_menu = { opacity = 1; };
	dropdown_menu = { opacity = 1; };
};